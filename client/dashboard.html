<!DOCTYPE html>
<!-- Customer dashboard page — requires login -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your VAVH.Studio dashboard — orders, wishlist and profile." />
  <title>My Dashboard — VAVH.Studio</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/pages/dashboard.css" />
</head>
<body class="page-enter">

  <!-- Navbar -->
  <nav class="navbar" id="mainNavbar">
    <div class="navbar-inner">
      <div class="navbar-left">
        <button class="nav-hamburger" id="navHamburger" aria-label="Open menu">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
        </button>
      </div>
      <div class="navbar-center">
        <a href="index.html" class="navbar-logo">VAVH.Studio</a>
      </div>
      <div class="navbar-right">
        <button class="nav-icon-btn" id="cartNavBtn" aria-label="Cart">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z" /></svg>
          <span class="nav-badge hidden" id="cartBadge">0</span>
        </button>
        <!-- Logout button for dashboard -->
        <button class="btn nav-login-btn" id="navLoginBtn" style="background:var(--color-surface);color:var(--color-text);">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" style="width:16px;height:16px;"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" /></svg>
          <span class="btn-text">Log out</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Dashboard body -->
  <div class="dashboard-page container">

    <!-- Page heading -->
    <div style="margin-bottom:var(--space-8);" class="reveal">
      <!-- Greeting updated by dashboard.js with user's name -->
      <p class="section-eyebrow">Welcome back</p>
      <h1 style="font-family:var(--font-display);font-size:var(--text-3xl);font-weight:var(--fw-medium);" id="dashGreeting">
        My Dashboard
      </h1>
    </div>

    <!-- Dashboard layout: sidebar + content -->
    <div class="dashboard-layout">

      <!-- ── Sidebar navigation ─────────────────────────── -->
      <aside class="sidebar reveal">
        <!-- User avatar + name -->
        <div style="text-align:center;padding-bottom:var(--space-6);border-bottom:1px solid var(--color-border);margin-bottom:var(--space-6);">
          <!-- User avatar circle with initials -->
          <div id="userAvatar" style="width:64px;height:64px;background:linear-gradient(135deg,var(--color-sage),var(--color-blush));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:var(--text-xl);font-weight:var(--fw-bold);color:white;margin:0 auto var(--space-3);">?</div>
          <!-- User name populated by JS -->
          <p id="sidebarUserName" style="font-weight:var(--fw-semi);font-size:var(--text-base);">Loading…</p>
          <!-- User email -->
          <p id="sidebarUserEmail" style="font-size:var(--text-xs);color:var(--color-text-muted);margin-top:var(--space-1);"></p>
        </div>

        <!-- Sidebar nav links — each triggers a tab switch via JS -->
        <nav id="dashNav">
          <!-- Website Management → opens storefront admin overlay directly -->
          <a href="/?admin=open" class="dash-nav-link w-full admin-link-item" style="color:var(--color-primary);font-weight:var(--fw-semi);display:none;text-decoration:none;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
            Website Management
          </a>
          <!-- VAVH Management → opens the full VAVH management system directly -->
          <a href="/admin/index.html" class="dash-nav-link w-full admin-link-item" style="color:var(--color-secondary);font-weight:var(--fw-semi);display:none;text-decoration:none;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" /></svg>
            VAVH Management
          </a>
          <button class="dash-nav-link w-full active" data-tab="overview">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
            Overview
          </button>
          <button class="dash-nav-link w-full" data-tab="orders">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z" /></svg>
            My Orders
          </button>
          <button class="dash-nav-link w-full" data-tab="delivered">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            Delivered
          </button>
          <button class="dash-nav-link w-full" data-tab="wishlist">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" /></svg>
            Wishlist
          </button>
          <button class="dash-nav-link w-full" data-tab="profile">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
            Edit Profile
          </button>
        </nav>

        <!-- Log out button at bottom of sidebar -->
        <div style="margin-top:var(--space-8);padding-top:var(--space-6);border-top:1px solid var(--color-border);">
          <button class="dash-nav-link w-full" id="sidebarLogout" style="color:var(--color-danger);">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" /></svg>
            Sign Out
          </button>
        </div>
      </aside>

      <!-- ── Main content area — tabs rendered by dashboard.js ── -->
      <main class="content-area" id="dashContent">
        <!-- Loading state while dashboard.js initialises -->
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading your dashboard…</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Order tracking modal -->
  <div class="modal-overlay" id="trackingModalOverlay" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Order Tracking</h2>
        <button class="modal-close" id="trackingModalClose" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
      </div>
      <div class="modal-body">
        <!-- Order ID header -->
        <p style="font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-4);">
          Order <strong id="trackingOrderId">#000</strong>
        </p>
        <!-- Tracking steps timeline — built by dashboard.js -->
        <div class="tracking-steps" id="trackingSteps"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Cart overlay (for repurchase add-to-cart) -->
  <div class="cart-overlay" id="cartOverlay" aria-hidden="true">
    <div class="cart-panel">
      <div class="cart-header">
        <h2 class="cart-title">Your Cart</h2>
        <button class="modal-close" id="cartClose" aria-label="Close cart"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
      </div>
      <div class="cart-items" id="cartItems">
        <div class="empty-state" id="cartEmpty">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z" /></svg>
          <h3>Your cart is empty</h3>
        </div>
      </div>
      <div class="cart-customer-section" id="cartCustomerSection" style="display:none;padding:1rem;border-top:1px solid var(--color-border);gap:1rem;">
        <h3 style="margin-bottom:.75rem;font-size:1rem;font-weight:600;">Customer details</h3>
        <div class="form-group">
          <label class="form-label" for="cartCustomerName">Name</label>
          <input class="form-input" id="cartCustomerName" type="text" placeholder="Enter full name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="cartCustomerEmail">Email</label>
          <input class="form-input" id="cartCustomerEmail" type="email" placeholder="Enter email address" />
        </div>
        <div class="form-group">
          <label class="form-label" for="cartCustomerPhone">Phone</label>
          <input class="form-input" id="cartCustomerPhone" type="tel" placeholder="Enter phone number" />
        </div>
        <div class="form-group">
          <label class="form-label" for="cartCustomerAddress">Delivery address</label>
          <textarea class="form-textarea" id="cartCustomerAddress" rows="3" placeholder="Enter delivery address"></textarea>
        </div>
      </div>
      <div class="cart-footer" id="cartFooter" style="display:none;">
        <div class="cart-total"><span>Total</span><span id="cartTotal">৳0</span></div>
        <button class="btn btn-primary w-full" id="checkoutBtn">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <script src="js/utils/constants.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/utils/analytics.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/features/cart.js"></script>
  <script src="js/features/wishlist.js"></script>
  <script src="js/features/auth.js"></script>
  <script src="js/features/orders.js"></script>
  <script src="js/animations/scrollReveal.js"></script>
  <!-- Dashboard page logic: tab system, profile edit, order list -->
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/admin.js"></script>
</body>
</html>
