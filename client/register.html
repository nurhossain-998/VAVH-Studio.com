<!DOCTYPE html>
<!-- Registration page for VAVH.Studio -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your VAVH.Studio account." />
  <title>Create Account — VAVH.Studio</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/pages/auth.css" />
</head>
<body class="page-enter">

  <!-- Minimal navbar for auth pages -->
  <nav class="navbar" id="mainNavbar">
    <div class="navbar-inner">
      <div class="navbar-left"></div>
      <div class="navbar-center">
        <a href="index.html" class="navbar-logo">VAVH.Studio</a>
      </div>
      <div class="navbar-right">
        <a href="index.html" class="btn btn-ghost btn-sm">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" style="width:16px;height:16px;"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" /></svg>
          Back to Shop
        </a>
      </div>
    </div>
  </nav>

  <main class="auth-page">
    <!-- Auth card slightly wider for registration form -->
    <div class="auth-card animate-scale" style="max-width:520px;">

      <div class="auth-logo">VAVH.Studio</div>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Join us and discover premium home décor</p>

      <!-- Registration form -->
      <form class="auth-form" id="registerForm" novalidate>

        <!-- Full name field -->
        <div class="form-group">
          <label class="form-label" for="regName">Full name</label>
          <input
            type="text"
            id="regName"
            name="name"
            class="form-input"
            placeholder="Your full name"
            autocomplete="name"
            required
          />
          <span class="form-error hidden" id="nameError"></span>
        </div>

        <!-- Email field -->
        <div class="form-group">
          <label class="form-label" for="regEmail">Email address</label>
          <input
            type="email"
            id="regEmail"
            name="email"
            class="form-input"
            placeholder="hello@example.com"
            autocomplete="email"
            required
          />
          <span class="form-error hidden" id="regEmailError"></span>
        </div>

        <!-- Phone field -->
        <div class="form-group">
          <label class="form-label" for="regPhone">Phone number</label>
          <input
            type="tel"
            id="regPhone"
            name="phone"
            class="form-input"
            placeholder="+880 1700 000000"
            autocomplete="tel"
          />
        </div>

        <!-- Address field -->
        <div class="form-group">
          <label class="form-label" for="regAddress">Delivery address</label>
          <input
            type="text"
            id="regAddress"
            name="address"
            class="form-input"
            placeholder="Dhaka, Bangladesh"
            autocomplete="street-address"
          />
        </div>

        <!-- Password field -->
        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <div style="position:relative;">
            <input
              type="password"
              id="regPassword"
              name="password"
              class="form-input"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              id="toggleRegPassword"
              style="position:absolute;right:var(--space-4);top:50%;transform:translateY(-50%);color:var(--color-text-muted);"
              aria-label="Toggle password visibility"
            >
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" style="width:18px;height:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            </button>
          </div>
          <span class="form-error hidden" id="regPasswordError"></span>
        </div>

        <!-- Confirm password field -->
        <div class="form-group">
          <label class="form-label" for="regConfirm">Confirm password</label>
          <input
            type="password"
            id="regConfirm"
            name="confirm"
            class="form-input"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required
          />
          <span class="form-error hidden" id="confirmError"></span>
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn btn-primary w-full btn-lg" id="registerSubmitBtn">
          <span class="spinner hidden" id="registerSpinner" style="width:18px;height:18px;border-width:2px;"></span>
          <span id="registerBtnText">Create Account</span>
        </button>

        <!-- General form error -->
        <p class="form-error text-center hidden" id="registerError" role="alert"></p>
      </form>

      <div class="auth-divider" style="margin-block:var(--space-6);">or</div>

      <p class="auth-footer">
        Already have an account?
        <a href="login.html">Sign in</a>
      </p>
    </div>
  </main>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="js/utils/constants.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/features/auth.js"></script>
  <!-- Register page: form validation + register API call -->
  <script src="js/pages/register.js"></script>
</body>
</html>
