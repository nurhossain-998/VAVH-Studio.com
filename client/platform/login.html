<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAVH  Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Roboto:wght@300;400;500;700&display=swap">
  <style>
    :root {
      --primary: #4caf50;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .login-container {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
      z-index: 10;
    }
    .logo {
      font-size: 32px;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 30px;
    }
    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 500;
    }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      font-family: inherit;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(76, 175, 80, 0.1);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: #43a047;
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(76, 175, 80, 0.4);
    }
    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 15px;
      display: none;
    }
    /* Background decorative blobs */
    .blob {
      position: absolute;
      filter: blur(80px);
      z-index: 1;
      border-radius: 50%;
    }
    .blob-1 {
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: rgba(76, 175, 80, 0.2);
    }
    .blob-2 {
      bottom: -150px;
      right: -150px;
      width: 500px;
      height: 500px;
      background: rgba(59, 130, 246, 0.15);
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-container">
    <div class="logo"><i class="fas fa-leaf"></i></div>
    <div class="title">VAVH Portal</div>
    <div class="subtitle">Log in to access your dashboard</div>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter your email">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
      <div id="errorMsg" class="error-msg">Invalid credentials.</div>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const csrfRes = await fetch('/api/csrf-token', { credentials: 'include' });
        const csrfData = await csrfRes.json();
        if (csrfRes.ok && csrfData.success && csrfData.csrfToken) {
          sessionStorage.setItem('vavh_csrf_token', csrfData.csrfToken);
        }
      } catch (err) {
        console.warn('CSRF token unavailable during page load:', err);
      }

      // If already logged in, redirect to dashboard
      fetch('/api/auth/session')
        .then(r => r.json())
        .then(data => {
          if (data.success && data.user) {
            window.location.href = '/platform/dashboard.html';
          }
        })
        .catch(console.error);
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      btn.innerText = 'Signing in...';
      btn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const csrfToken = sessionStorage.getItem('vavh_csrf_token');
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            ...(csrfToken ? { 'X-CSRF-Token': csrfToken } : {})
          },
          body: JSON.stringify({ identifier: email, password })
        });
        const data = await res.json();
        
        if (data.success) {
          window.location.href = '/platform/dashboard.html';
        } else {
          errorMsg.innerText = data.message || 'Login failed.';
          errorMsg.style.display = 'block';
          btn.innerText = 'Sign In';
          btn.disabled = false;
        }
      } catch (err) {
        errorMsg.innerText = 'Network error. Please try again.';
        errorMsg.style.display = 'block';
        btn.innerText = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
